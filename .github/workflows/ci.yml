name: CI

on:
  push:
    branches:
      - master
      - develop
      - "codex/**"
      - "claude/**"
      - "bloom/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: write

jobs:
  build-and-tests:
    name: Build and token tests
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\OpenClawManager.sln

      - name: Build
        run: dotnet build .\OpenClawManager.sln --configuration Release --no-restore

      - name: TokenService tests
        run: dotnet run --project .\TokenService.Tests\TokenService.Tests.csproj --configuration Release

  release-installers:
    name: Release installers
    runs-on: windows-2025
    needs: build-and-tests
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish Full and Lite payloads
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $full = Join-Path $PWD "artifacts\publish-full"
          $lite = Join-Path $PWD "artifacts\publish-lite"
          Remove-Item -Path $full, $lite -Recurse -Force -ErrorAction SilentlyContinue

          dotnet publish .\OpenClawManager.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o $full
          dotnet publish .\OpenClawManager.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -p:BuildProfile=Lite -o $lite

          "{}" | Set-Content -Path (Join-Path $full "settings.json") -Encoding UTF8
          "{}" | Set-Content -Path (Join-Path $lite "settings.json") -Encoding UTF8

          Remove-Item -Path (Join-Path $lite "Resources\splash.mp4") -Force -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installers and portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $full = Join-Path $PWD "artifacts\publish-full"
          $lite = Join-Path $PWD "artifacts\publish-lite"
          $out = Join-Path $PWD "artifacts\release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc .\Installer\OpenClawManager-Full.iss "/DAppVersion=$version" "/DSourceDir=$full" "/O$out"
          & $iscc .\Installer\OpenClawManager-Lite.iss "/DAppVersion=$version" "/DSourceDir=$lite" "/O$out"

          Compress-Archive -Path (Join-Path $full "*") -DestinationPath (Join-Path $out "OpenClawManagerTool-$tag-win-x64.zip") -Force
          Compress-Archive -Path (Join-Path $lite "*") -DestinationPath (Join-Path $out "OpenClawManagerTool-$tag-win-x64-lite-portable.zip") -Force

          Get-ChildItem $out -File | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ASCII
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag .\artifacts\release-assets\* --clobber
